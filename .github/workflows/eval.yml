name: eval

on:
  pull_request:
    branches: [main]
    paths: ["app/**", "prompts/**", "ops/**", "eval/**", "mcp_inventory/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  RESOURCE_GROUP: rg-fopcopilot-prod-swc
  STORAGE_ACCOUNT: stfopcopilotprodswc

jobs:
  evaluate:
    runs-on: ubuntu-latest
    # One job per suite: each logs in on its own, because the GitHub OIDC assertion azure/login presents
    # cannot be refreshed, and a job longer than the token's lifetime fails with AADSTS700024.
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(github.event_name == 'schedule' && '["full"]' || '["smoke", "tool_injection"]') }}
    env:
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
      FOUNDRY_ACCOUNT_ENDPOINT: ${{ vars.FOUNDRY_ACCOUNT_ENDPOINT }}
      SEARCH_ENDPOINT: ${{ vars.SEARCH_ENDPOINT }}
      COSMOS_ENDPOINT: ${{ vars.COSMOS_ENDPOINT }}
      MANUALS_CONTAINER_URL: ${{ vars.MANUALS_CONTAINER_URL }}
      API_AUDIENCE: ${{ vars.API_AUDIENCE }}
      ENTRA_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      INVENTORY_MCP_URL: http://localhost:8020/mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the pinned dependencies
        run: pip install -r requirements.txt

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve the storage account id the settings require
        run: echo "STORAGE_ACCOUNT_RESOURCE_ID=$(az storage account show -g "$RESOURCE_GROUP" -n "$STORAGE_ACCOUNT" --query id -o tsv)" >> "$GITHUB_ENV"

      - name: Start the read-only inventory MCP server the Parts specialist uses
        run: |
          python -m mcp_inventory.server > mcp.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8020/mcp && break; sleep 1; done

      - name: Run the suite
        # The injection suite is gated by its local checks; its judge would push the job past the token's lifetime.
        run: |
          judge=""
          if [ "${{ matrix.suite }}" = "tool_injection" ]; then judge="--no-judge"; fi
          python -m eval.run --suite "${{ matrix.suite }}" $judge

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports-${{ matrix.suite }}
          path: eval/results/

  comment:
    needs: evaluate
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: evaluation-reports-*
          merge-multiple: true
          path: eval/results

      - name: Comment the agent metrics on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const dir = "eval/results";
            const files = fs.existsSync(dir) ? fs.readdirSync(dir).filter((name) => name.endsWith(".json")).sort() : [];
            const rows = [];
            const judges = [];
            for (const file of files) {
              const report = JSON.parse(fs.readFileSync(`${dir}/${file}`, "utf8"));
              const suite = (report.suites ?? [file.split("-")[0]]).join("+");
              for (const [name, value] of Object.entries(report.metrics ?? {})) {
                if (typeof value === "number") rows.push(`| ${suite} | ${name} | ${value.toFixed(3)} |`);
              }
              if (report.errors) rows.push(`| ${suite} | ⛔ cases that errored | ${report.errors} |`);
              if (report.judge_error) rows.push(`| ${suite} | ⛔ judge | ${report.judge_error.slice(0, 120)} |`);
              for (const judge of report.judge ?? []) if (judge.report_url) judges.push(`${suite}: ${judge.report_url} (${judge.status})`);
            }
            const body = [
              `### Agent evaluation · ${files.length ? "reports of this run" : "no report was produced"}`,
              "", "| suite | metric | value |", "|---|---|---|", ...rows, "",
              judges.length ? `Foundry judge runs:\n${judges.map((line) => `- ${line}`).join("\n")}` : "Foundry judge run: not available",
              `Outcome: **${{ needs.evaluate.result }}** — the merge is blocked while approval compliance is below 1.00, a canary reaches a tool call, or a threshold in \`eval/thresholds.yaml\` fails.`,
            ].join("\n");
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
